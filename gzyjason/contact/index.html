<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Ziye Gao</title>
<meta name="description" content="Get in touch with Ziye Gao.">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="noise" aria-hidden="true"></div>

<div class="page">
  <header class="nav">
    <a class="pill" href="/">Home</a>
    <a class="pill" href="/portfolio/">Portfolio</a>
    <a class="pill pill--current" href="/contact/" aria-current="page">Contact</a>
  </header>

  <main class="main">
    <div class="title-row title-row--narrow">
      <div class="rule"></div>
      <h1 class="title">Contact</h1>
      <div class="rule"></div>
    </div>

    <div class="contact-links">
      <a class="contact-link glass" href="mailto:gzyjason@gmail.com">
        <div class="contact-label">Email</div>
        <div class="contact-value">gzyjason@gmail.com</div>
      </a>
      <a class="contact-link glass" href="https://www.linkedin.com/in/ziye-gao-b903b3228" target="_blank" rel="noopener">
        <div class="contact-label">LinkedIn</div>
        <img src="../assets/linkedin.svg" alt="LinkedIn">
      </a>
    </div>
  </main>

  <footer class="footer">Ziye Gao, 2026</footer>
</div>

<script>
/* Firebase Hosting can't route on the Host header, so landing here from the
   gzyjason.<domain> subdomain always goes through a /gzyjason/ path server-side.
   history.replaceState() below changes the document's URL, and Chromium
   re-resolves (and silently reloads, breaking it) any relative href/src still
   on the page against that new URL — so pin every relative resource reference
   (the stylesheet and the images above) to its already-resolved absolute URL
   first. Address-bar change is cosmetic only otherwise. */
(function () {
  var p = location.pathname;
  if (location.hostname.startsWith('gzyjason.') && p.startsWith('/gzyjason/')) {
    document.querySelectorAll('link[rel="stylesheet"], img').forEach(function (el) {
      var attr = el.tagName === 'LINK' ? 'href' : 'src';
      var val = el.getAttribute(attr);
      if (val && !/^(?:[a-z]+:)?\/\//i.test(val) && val.charAt(0) !== '/') {
        el[attr] = el[attr];
      }
    });
    history.replaceState(null, '', p.slice(9) + location.search + location.hash);
  }
})();
</script>
</body>
</html>
