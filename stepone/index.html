<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StepOne</title>
<meta name="description" content="Build motivation by completing simple, achievable tasks.">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="page">

  <section class="hero">
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>
    <div class="blob blob--3"></div>

    <div class="hero-row">
      <img class="hero-logo" src="./assets/logo.png" alt="StepOne logo" width="460" height="682">
    </div>
    <div class="hero-row">
      <div class="hero-wordmark">StepOne</div>
    </div>

    <div class="hero-arrow">
      <div class="hero-arrow-inner">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(64,56,40,0.55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>
      </div>
    </div>
  </section>

  <!-- Selling points; .section markup is generated by main.js from SECTIONS -->
  <main id="sections"></main>

  <footer class="footer">
    <div class="badges">
      <a id="appStoreLink" class="badge-appstore" href="#" target="_blank" rel="noopener">
        <img src="./assets/appstore.svg" alt="Download on the App Store" width="120" height="40">
      </a>
      <a class="badge-github" href="https://github.com/gzyjason/StepOne" target="_blank" rel="noopener">
        <img src="./assets/github.svg" alt="View on GitHub" width="448" height="127">
      </a>
    </div>
    <nav class="legal">
      <a href="./faq/">Frequently Asked Questions</a>
      <a href="./terms/">Terms and Conditions</a>
      <a href="./privacy/">Privacy Policy</a>
    </nav>
  </footer>

</div>

<script src="./main.js"></script>
<script>
/* Firebase Hosting can't route on the Host header, so landing here from the
   stepone.<domain> subdomain always goes through a /stepone/ path server-side.
   history.replaceState() below changes the document's URL, and Chromium
   re-resolves (and silently reloads, breaking it) any relative href/src still
   on the page against that new URL — so pin every relative resource reference
   (the stylesheet, the static images above, and main.js's dynamically-created
   section/phone images) to its already-resolved absolute URL first.
   Address-bar change is cosmetic only otherwise. */
(function () {
  var p = location.pathname;
  if (location.hostname.startsWith('stepone.') && p.startsWith('/stepone/')) {
    document.querySelectorAll('link[rel="stylesheet"], img').forEach(function (el) {
      var attr = el.tagName === 'LINK' ? 'href' : 'src';
      var val = el.getAttribute(attr);
      if (val && !/^(?:[a-z]+:)?\/\//i.test(val) && val.charAt(0) !== '/') {
        el[attr] = el[attr];
      }
    });
    history.replaceState(null, '', p.slice(8) + location.search + location.hash);
  }
})();
</script>
</body>
</html>
